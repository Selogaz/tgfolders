[project]
name = "tgfolders"
version = "0.1.0"
description = "Sort your Telegram groups and channels into chat folders by keyword rules, with a dry-run plan and protected folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["telegram", "telethon", "folders", "chat folders", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "telethon>=1.40",
    "keyring>=24",
    "qrcode>=7.4",
]

[project.scripts]
tgfolders = "tgfolders.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgfolders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
